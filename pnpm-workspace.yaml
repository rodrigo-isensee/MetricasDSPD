packages:
  - "packages/*"
  - server
  - "tools/*"
  - web
  - e2e
onlyBuiltDependencies:
  - esbuild
overrides:
  tmp: ">=0.2.6"
  uuid: ">=11.1.1"
  basic-ftp: ">=6.2.1"
  playwright-core: "1.65.1"
  katex: "0.18.2"
  # Alerta Dependabot #12 (critico): bypass do SAFE_FOR_TEMPLATES, corrigido na 3.4.17
  dompurify: "3.4.17"
  # vite 8.3.5 quebra o test:pg (K-182): extractInlineSourceMap chama code.charCodeAt, mas o vitest 5.0.5 entrega o
  # código do globalSetup como Buffer; qualquer stack que passe por tests/pg/global-setup.ts (jiti do node-pg-migrate
  # com cache frio, como na CI) cai em "Startup Error". Reverter quando sair vitest com a correção.
  vite: "8.3.4"
  # Alertas Dependabot #18 a #25 (fast-uri, produção via fastify): override de patch na mesma linha maior (pedido 062)
  "fast-uri@3": "3.1.9"
  "fast-uri@4": "4.2.3"
