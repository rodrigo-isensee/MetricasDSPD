packages:
  - "packages/*"
  - server
  - "tools/*"
  - web
  - e2e
onlyBuiltDependencies:
  - esbuild
overrides:
  tmp: ">=0.2.6"
  uuid: ">=11.1.1"
  basic-ftp: ">=6.2.1"
  playwright-core: "1.64.0"
  katex: "0.18.2"
  # Alerta Dependabot #12 (critico): bypass do SAFE_FOR_TEMPLATES, corrigido na 3.4.17
  dompurify: "3.4.17"
