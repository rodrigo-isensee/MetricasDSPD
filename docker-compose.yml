# Ambiente local (ADR 0014: tudo local, custo zero). Uso: docker compose up | pnpm run stack:up | db:up | db:down | db:reset | test:pg
# Um servidor PostgreSQL 17 com dois databases: `metricas` (desenvolvimento) e `metricas_test` (testes, um conjunto de schemas por execução).
name: ${COMPOSE_PROJECT_NAME:-metricasdspd}

services:
  postgres:
    image: postgres:17
    environment:
      TZ: UTC
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-me-postgres}
      DSPD_PWD_MIGRADOR: ${DSPD_PWD_MIGRADOR:-migrador_dev}
      DSPD_PWD_COLETOR: ${DSPD_PWD_COLETOR:-coletor_dev}
      DSPD_PWD_API: ${DSPD_PWD_API:-api_dev}
      DSPD_PWD_REF: ${DSPD_PWD_REF:-ref_dev}
      DSPD_PWD_WEBHOOK: ${DSPD_PWD_WEBHOOK:-webhook_dev}
      DSPD_PWD_AUTOMACAO: ${DSPD_PWD_AUTOMACAO:-automacao_dev}
      DSPD_PWD_PESQUISA: ${DSPD_PWD_PESQUISA:-pesquisa_dev}
      DSPD_PWD_APONTAMENTO: ${DSPD_PWD_APONTAMENTO:-apontamento_dev}
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    volumes:
      - dspd-pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metricas_test"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "--import", "tsx", "src/entradas/migrar.ts"]
    environment:
      PG_MIGRADOR_URL: postgres://dspd_migrador:${DSPD_PWD_MIGRADOR:-migrador_dev}@postgres:5432/metricas
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # A api só recebe a credencial dspd_api: nunca a do coletor.
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      PG_API_URL: postgres://dspd_api:${DSPD_PWD_API:-api_dev}@postgres:5432/metricas
      # Webhook do BusinessMap (S-12): só liga com WEBHOOK_BM_SEGREDO (>= 16 caracteres) no .env; papel dspd_webhook (só INSERT).
      PG_WEBHOOK_URL: ${WEBHOOK_BM_SEGREDO:+postgres://dspd_webhook:${DSPD_PWD_WEBHOOK:-webhook_dev}@postgres:5432/metricas}
      WEBHOOK_BM_SEGREDO: ${WEBHOOK_BM_SEGREDO:-}
      # Aba Apontamento (pedido 059, ADR 0020 revisão 4): papel próprio e interruptor do nome real (padrão desligado). A API escuta 0.0.0.0 no contêiner e a
      # porta é publicada só em 127.0.0.1, o que `APONTAMENTO_PUBLICACAO_LOOPBACK=1` declara para a guarda de partida.
      PG_APONTAMENTO_URL: postgres://dspd_api_apontamento:${DSPD_PWD_APONTAMENTO:-apontamento_dev}@postgres:5432/metricas
      APONTAMENTO_NOMES: ${APONTAMENTO_NOMES:-0}
      APONTAMENTO_PUBLICACAO_LOOPBACK: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # O worker só recebe a credencial dspd_coletor.
  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "--import", "tsx", "src/entradas/worker.ts"]
    environment:
      PG_COLETOR_URL: postgres://dspd_coletor:${DSPD_PWD_COLETOR:-coletor_dev}@postgres:5432/metricas
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Coleta agendada (pedido 061, ADR 0022 item 6 e ADR 0023 §8). Perfil "coleta": não sobe com `up`; o timer do host chama
  # `docker compose run --rm coleta <script> [args]` (deploy/systemd/). Sem porta publicada. É o ÚNICO serviço que recebe a apikey do
  # BusinessMap e a senha do MySQL do Acelerato: vêm do arquivo de ambiente do host (COLETA_ENV_FILE, permissão 600), nunca da imagem.
  coleta:
    profiles: ["coleta"]
    build: { context: ., dockerfile: server/Dockerfile }
    entrypoint: ["node", "--import", "tsx"]
    command: ["src/entradas/coleta-businessmap.ts", "incremental", "--projetar"]
    env_file:
      - path: ${COLETA_ENV_FILE:-/etc/metricas-dspd/coleta.env}
        required: false
    environment:
      PG_COLETOR_URL: postgres://dspd_coletor:${DSPD_PWD_COLETOR:-coletor_dev}@postgres:5432/metricas
      DSPD_PWD_REF: ${DSPD_PWD_REF:-ref_dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # PEM do certificado do Acelerato: ACELERATO_MYSQL_TLS_CERT_FILE aponta para /segredos/acelerato.pem no arquivo de ambiente.
    volumes:
      - ${COLETA_SEGREDOS_DIR:-/etc/metricas-dspd/segredos}:/segredos:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., dockerfile: docker/web/Dockerfile }
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  dspd-pg-data:
