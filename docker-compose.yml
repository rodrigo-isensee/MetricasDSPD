# Ambiente local de banco. Uso: pnpm run db:up | db:down | db:reset | test:mysql
x-mysql: &mysql
  image: mysql:8.4
  command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00", "--default-storage-engine=InnoDB"]
  environment: &env
    TZ: UTC
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina no .env (veja .env.example)}
    DSPD_PWD_MIGRADOR: ${DSPD_PWD_MIGRADOR:-migrador_dev}
    DSPD_PWD_COLETOR: ${DSPD_PWD_COLETOR:-coletor_dev}
    DSPD_PWD_API: ${DSPD_PWD_API:-api_dev}
    DSPD_PWD_REF: ${DSPD_PWD_REF:-ref_dev}
    DSPD_PWD_WEBHOOK: ${DSPD_PWD_WEBHOOK:-webhook_dev}
    DSPD_PWD_AUTOMACAO: ${DSPD_PWD_AUTOMACAO:-automacao_dev}
  volumes:
    - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

services:
  mysql:
    <<: *mysql
    container_name: dspd-mysql
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes:
      - dspd-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Descartável: sem volume (tmpfs), perfil "test"; os testes recriam os schemas.
  mysql-test:
    <<: *mysql
    profiles: ["test"]
    container_name: dspd-mysql-test
    ports: ["${MYSQL_TEST_PORT:-3307}:3306"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 5s

volumes:
  dspd-mysql-data:
