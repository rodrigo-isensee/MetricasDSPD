<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Métricas DSPD · Dados fictícios</title>
    <script>
      // Aplica o tema antes da primeira pintura (sem flash).
      ;(function () {
        try {
          var p = localStorage.getItem('metricas-dspd:tema')
          var escuro =
            p === 'escuro' || (p !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', escuro ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
