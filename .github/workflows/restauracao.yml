name: Restauração verificada

# C2 (auditoria do banco): prova mensal de que o backup restaura. Semeia o banco (mock), faz o backup com o script real,
# restaura num banco novo, confere `migrate up` = 0 migrações e contagens/catálogo iguais. Só dado mock: nunca dado real.
on:
  schedule:
    - cron: '0 7 1 * *' # dia 1, 04:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  restauracao:
    name: restauracao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_ci
      DSPD_PWD_MIGRADOR: migrador_dev
      DSPD_PWD_COLETOR: coletor_dev
      DSPD_PWD_API: api_dev
      DSPD_PWD_REF: ref_dev
      DSPD_PWD_WEBHOOK: webhook_dev
      DSPD_PWD_AUTOMACAO: automacao_dev
      PG_MIGRADOR_URL: postgres://dspd_migrador:migrador_dev@127.0.0.1:5432/metricas
      DSPD_PG_CONTAINER: pgci
      DSPD_COMPARAR_COM_VIVO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Contêiner próprio (e não `services:`) para os scripts usarem o pg_dump/pg_restore 17 de dentro dele (`DSPD_PG_CONTAINER`).
      - name: PostgreSQL 17 com os papéis do projeto
        run: |
          docker run -d --name pgci -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD -e DSPD_PWD_MIGRADOR -e DSPD_PWD_COLETOR -e DSPD_PWD_API -e DSPD_PWD_REF -e DSPD_PWD_WEBHOOK -e DSPD_PWD_AUTOMACAO \
            -v "$PWD/docker/postgres/init:/docker-entrypoint-initdb.d:ro" postgres:17
          until docker exec pgci pg_isready -U postgres -d metricas_test >/dev/null 2>&1; do sleep 2; done
      - name: Migrar e semear (mock)
        run: |
          pnpm --filter @metricas-dspd/server run migrate up
          pnpm --filter @metricas-dspd/server run seed
      - name: Backup (script real)
        run: DSPD_BACKUP_DIR="$RUNNER_TEMP/backups" bash scripts/db-backup.sh
      - name: Restauração verificada (restaura, migrate up = 0, contagens e catálogo)
        run: DSPD_BACKUP_DIR="$RUNNER_TEMP/backups" bash scripts/db-restaurar-verificada.sh
