name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * *' # 02:00 em Brasília: perf noturno
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  rapida:
    name: rapida
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck

  testes:
    name: testes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Igual ao `pronto` sem o build: typecheck + cobertura 100% bloqueante em cada pacote.
      - run: pnpm -r --if-present run typecheck
      - run: pnpm run cobertura
      - name: Resumo de cobertura no job
        if: always()
        run: |
          {
            echo '### Cobertura (limite 100%)'
            echo '| Pacote | Linhas | Ramos | Funções |'
            echo '|---|---|---|---|'
            for p in server web tools/homolog; do
              f="$p/coverage/coverage-summary.json"
              [ -f "$f" ] && node -e "const t=require('./$f').total;console.log('| $p | '+['lines','branches','functions'].map(k=>t[k].pct+'%').join(' | ')+' |')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cobertura
          path: |
            server/coverage
            web/coverage
          retention-days: 3
      # Conferência spec<->teste (Node puro, sem Python); o --check do plugin Siegard é só local.
      - run: pnpm run spec:check
      # Contratos e diagramas: páginas geradas = código, compatibilidade dos schemas, links, órfãs, cabeçalho e Mermaid.
      - run: pnpm run docs:check

  filtro:
    name: filtro
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      banco: ${{ steps.f.outputs.banco }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: f
        with:
          filters: |
            banco:
              - 'server/**'
              - 'packages/**'
              - 'scripts/**'
              - 'docker/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  banco:
    name: banco
    needs: filtro
    # Pulado (conta como aprovado) quando nada de server/, packages/ ou migrações mudou.
    # Em PR para homolog ou main roda sempre (migração é o que mais quebra na promoção).
    if: needs.filtro.outputs.banco == 'true' || github.event_name == 'workflow_dispatch' || github.base_ref == 'homolog' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPASSWORD: postgres_ci
      POSTGRES_USER: postgres
      DSPD_PWD_MIGRADOR: migrador_dev
      DSPD_PWD_COLETOR: coletor_dev
      DSPD_PWD_API: api_dev
      DSPD_PWD_REF: ref_dev
      DSPD_PWD_WEBHOOK: webhook_dev
      DSPD_PWD_AUTOMACAO: automacao_dev
      DSPD_PWD_PESQUISA: pesquisa_dev
      PG_TESTE_URL: postgres://dspd_migrador:migrador_dev@127.0.0.1:5432/metricas_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Papéis e databases (mesmo script do Compose)
        run: bash docker/postgres/init/01-databases-papeis.sh
      - run: pnpm --filter @metricas-dspd/server run test:pg

  openapi:
    name: openapi
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: docs/api/openapi.json gerado = versionado
        run: pnpm --filter @metricas-dspd/server run openapi:verificar

  imagem:
    name: imagem
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build da imagem do servidor (sem publicar)
        run: docker build -f server/Dockerfile -t metricas-dspd-server .

  build:
    name: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @metricas-dspd/web run size
      - name: Gate (fronteiras BM x AC, hash da base mock, tamanho)
        run: pnpm --filter @metricas-dspd/e2e run gate

  e2e-parte:
    name: e2e-parte (${{ matrix.parte }}/2)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versão do Playwright
        id: pw
        run: echo "v=$(pnpm --filter @metricas-dspd/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        id: pwcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Instala navegador e dependências do sistema
        run: |
          if [ '${{ steps.pwcache.outputs.cache-hit }}' = 'true' ]; then
            pnpm --filter @metricas-dspd/e2e exec playwright install-deps chromium
          else
            pnpm --filter @metricas-dspd/e2e exec playwright install --with-deps chromium
          fi
      - name: Diagramas Mermaid renderizam (mermaid-cli com o Chromium do Playwright)
        if: matrix.parte == 1
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(pnpm --filter @metricas-dspd/e2e exec node -p "require('@playwright/test').chromium.executablePath()")"
          pnpm run docs:mermaid
      - name: E2E (parte ${{ matrix.parte }} de 2)
        run: pnpm --filter @metricas-dspd/e2e run test:chromium --shard=${{ matrix.parte }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-relatorio-${{ matrix.parte }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 3

  # Check obrigatório do ruleset: o nome `e2e` é mantido. Verde só se as 2 partes passarem.
  e2e:
    name: e2e
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: e2e-parte
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: As 2 partes da E2E passaram
        env:
          RESULTADO: ${{ needs.e2e-parte.result }}
        run: |
          echo "e2e-parte: $RESULTADO"
          test "$RESULTADO" = "success"

  perf:
    name: perf
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'homolog' || github.base_ref == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versão do Playwright
        id: pw
        run: echo "v=$(pnpm --filter @metricas-dspd/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        id: pwcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Instala navegador e dependências do sistema
        run: |
          if [ '${{ steps.pwcache.outputs.cache-hit }}' = 'true' ]; then
            pnpm --filter @metricas-dspd/e2e exec playwright install-deps chromium
          else
            pnpm --filter @metricas-dspd/e2e exec playwright install --with-deps chromium
          fi
      - run: pnpm run build
      - name: Perf (C6 com 1 rodada, runner exclusivo e estável)
        run: pnpm --filter @metricas-dspd/e2e run test:perf
        env:
          PERF_RODADAS_C6: '1'
      - run: pnpm --filter @metricas-dspd/e2e run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: perf-relatorios
          path: |
            e2e/lighthouse/relatorios
            e2e/perf-results
          retention-days: 3

  seguranca:
    name: seguranca
    # Informativo: nunca bloqueia (não faz parte da proteção da main).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Auditoria de dependências de produção
        run: |
          pnpm audit --prod 2>&1 | tee audit.txt || echo '::warning::pnpm audit encontrou vulnerabilidades (informativo)'
          { echo '### pnpm audit --prod'; echo '```'; tail -n 30 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Varredura de segredos (gitleaks via imagem oficial, sem licença)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner --exit-code 1 \
            || echo '::warning::gitleaks encontrou possíveis segredos (informativo)'
