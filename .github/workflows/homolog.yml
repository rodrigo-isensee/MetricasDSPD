name: Homologação

# Portão da branch `homolog` (push) e rodada noturna contra a ponta de `homolog` (agendamento).
# O check `homolog-aprovada` (homolog-aprovada.yml) lê as EXECUÇÕES concluídas deste workflow (API de Actions)
# e procura o job `portao <sha>` em sucesso: push = portão; schedule = noturna. Não há status de commit.
# Documentação pura roda só o docs:check (H-2). O schedule só dispara com este arquivo na branch padrão.
on:
  push:
    branches: [homolog]
  schedule:
    - cron: '30 5 * * *' # 02:30 em Brasília
  workflow_dispatch: # em homolog vale como a noturna enquanto este arquivo não está na main (1ª release)

concurrency:
  group: homolog-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  escopo:
    name: escopo
    runs-on: [self-hosted, metricas]
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.alvo.outputs.sha }}
      escopo: ${{ steps.alvo.outputs.escopo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.sha || 'homolog' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - id: alvo
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
        run: |
          sha="$(git rev-parse HEAD)"
          base="origin/main"
          if [ "$EVENTO" = 'push' ] && ! echo "$ANTES" | grep -qE '^0+$'; then base="$ANTES"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "escopo=$(node tools/homolog/src/main.ts escopo --base "$base" --head "$sha")" >> "$GITHUB_OUTPUT"

  portao-docs:
    name: portao-docs
    needs: escopo
    if: needs.escopo.outputs.escopo == 'docs'
    runs-on: [self-hosted, metricas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.escopo.outputs.sha }}
      - uses: ./.github/actions/preparar
      - run: pnpm run docs:check

  qualidade:
    name: qualidade
    needs: escopo
    if: needs.escopo.outputs.escopo == 'codigo'
    runs-on: [self-hosted, metricas]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.escopo.outputs.sha }}
      - uses: ./.github/actions/preparar
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      # E7.541: no runner, buscas do web (findBy) passam de 5 s (5,2 a 8,5 s) só por lentidão; a folga vale só aqui.
      - run: pnpm run cobertura
        env:
          METRICAS_DSPD_ESPERA_ASYNC_MS: '15000'
      - run: pnpm run spec:check
      - run: pnpm run docs:check
      - run: pnpm --filter @metricas-dspd/server run openapi:verificar
      - run: pnpm run build
      - run: pnpm --filter @metricas-dspd/web run size
      - run: pnpm --filter @metricas-dspd/e2e run gate

  banco:
    name: banco-homolog
    needs: escopo
    if: needs.escopo.outputs.escopo == 'codigo'
    runs-on: [self-hosted, metricas]
    timeout-minutes: 20
    # Postgres 17 local do runner (127.0.0.1:5432, postgres/postgres_ci): sem `services:`.
    env:
      PGHOST: 127.0.0.1
      PGPASSWORD: postgres_ci
      POSTGRES_USER: postgres
      DSPD_PWD_MIGRADOR: migrador_dev
      DSPD_PWD_COLETOR: coletor_dev
      DSPD_PWD_API: api_dev
      DSPD_PWD_REF: ref_dev
      DSPD_PWD_WEBHOOK: webhook_dev
      DSPD_PWD_AUTOMACAO: automacao_dev
      DSPD_PWD_PESQUISA: pesquisa_dev
      DSPD_PWD_APONTAMENTO: apontamento_dev
      PG_TESTE_URL: postgres://dspd_migrador:migrador_dev@127.0.0.1:5432/metricas_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.escopo.outputs.sha }}
      - uses: ./.github/actions/preparar
      - name: Papéis e databases (mesmo script do Compose)
        run: bash docker/postgres/init/01-databases-papeis.sh
      - run: pnpm --filter @metricas-dspd/server run test:pg

  # A E2E do portão em 2 partes (mesmo mecanismo do ci.yml, #154): cada parte roda metade da suíte com --shard.
  e2e-parte:
    name: e2e-homolog-parte (${{ matrix.parte }}/2)
    needs: escopo
    if: needs.escopo.outputs.escopo == 'codigo'
    # Navegador e libs do Playwright já vêm na imagem do runner (sem `container:`).
    runs-on: [self-hosted, metricas]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.escopo.outputs.sha }}
      - uses: ./.github/actions/preparar
      - uses: ./.github/actions/playwright
      - name: Diagramas Mermaid renderizam
        if: matrix.parte == 1
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(pnpm --filter @metricas-dspd/e2e exec node -p "require('@playwright/test').chromium.executablePath()")"
          pnpm run docs:mermaid
      - name: E2E (parte ${{ matrix.parte }} de 2)
        run: pnpm --filter @metricas-dspd/e2e run test:chromium --shard=${{ matrix.parte }}/2 --workers=3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-relatorio-${{ matrix.parte }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 3

  # Agregador: mantém o id `e2e` e o nome `e2e-homolog` que o `portao` consome. Verde só se as 2 partes passarem.
  e2e:
    name: e2e-homolog
    needs: [escopo, e2e-parte]
    if: always() && needs.escopo.outputs.escopo == 'codigo'
    runs-on: [self-hosted, metricas]
    timeout-minutes: 5
    steps:
      - name: As 2 partes da E2E do portão passaram
        env:
          RESULTADO: ${{ needs.e2e-parte.result }}
        run: |
          echo "e2e-parte: $RESULTADO"
          test "$RESULTADO" = "success"

  perf:
    name: perf-homolog
    needs: escopo
    if: needs.escopo.outputs.escopo == 'codigo'
    # Navegador e libs do Playwright já vêm na imagem do runner (sem `container:`).
    runs-on: [self-hosted, metricas]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.escopo.outputs.sha }}
      - uses: ./.github/actions/preparar
      - uses: ./.github/actions/playwright
      - run: pnpm run build
      - name: Perf (C6 com 1 rodada, runner exclusivo e estável)
        run: pnpm --filter @metricas-dspd/e2e run test:perf
        env:
          PERF_RODADAS_C6: '1'
      - run: pnpm --filter @metricas-dspd/e2e run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: perf-relatorios
          path: |
            e2e/lighthouse/relatorios
            e2e/perf-results
          retention-days: 3

  # H1: migra com o código da main e depois com o candidato (e repete o candidato). Runner próprio, sem Docker.
  migracao:
    name: migracao
    needs: escopo
    if: needs.escopo.outputs.escopo == 'codigo'
    runs-on: [self-hosted, metricas]
    timeout-minutes: 30
    # Postgres 17 local do runner (127.0.0.1:5432, postgres/postgres_ci): sem `services:`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.escopo.outputs.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main-src
      - uses: ./.github/actions/preparar
      - name: Dependências da main
        working-directory: main-src
        run: pnpm install --frozen-lockfile
      - name: Papéis e databases do Postgres de serviço (só para a verificação de migração)
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres_ci
          POSTGRES_USER: postgres
          DSPD_PWD_MIGRADOR: migrador_dev
          DSPD_PWD_COLETOR: coletor_dev
          DSPD_PWD_API: api_dev
          DSPD_PWD_REF: ref_dev
          DSPD_PWD_WEBHOOK: webhook_dev
          DSPD_PWD_AUTOMACAO: automacao_dev
          DSPD_PWD_PESQUISA: pesquisa_dev
          DSPD_PWD_APONTAMENTO: apontamento_dev
        run: bash docker/postgres/init/01-databases-papeis.sh
      - name: Migração a partir do estado da main
        env:
          PG_MIGRADOR_URL: postgres://dspd_migrador:migrador_dev@127.0.0.1:5432/metricas
        run: node tools/homolog/src/main.ts migracao --origem main-src --destino .

  # H2: sobe a pilha de homologação (compose) e confere o smoke. Precisa de Docker, que o runner próprio não tem:
  # ubuntu-latest (hospedado), só no push em homolog e no workflow_dispatch; a noturna não o roda.
  smoke:
    name: smoke
    needs: escopo
    if: needs.escopo.outputs.escopo == 'codigo' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.escopo.outputs.sha }}
      - uses: ./.github/actions/preparar
      - name: Ambiente de homologação (segredos gerados nesta execução)
        run: |
          {
            for chave in HOMOLOG_PG_SUPERUSER_PWD DSPD_PWD_MIGRADOR DSPD_PWD_COLETOR DSPD_PWD_API DSPD_PWD_REF DSPD_PWD_WEBHOOK DSPD_PWD_AUTOMACAO DSPD_PWD_PESQUISA DSPD_PWD_APONTAMENTO; do
              echo "$chave=$(openssl rand -hex 16)"
            done
          } > .env.homolog
          chmod 600 .env.homolog
      - name: Sobe a pilha, semeia e roda o smoke
        run: pnpm run homolog:subir
      - name: Derruba a pilha
        if: always()
        run: pnpm run homolog:derrubar -- --volume

  portao:
    name: portao ${{ needs.escopo.outputs.sha }}
    needs: [escopo, portao-docs, qualidade, banco, e2e, perf, migracao, smoke]
    if: always()
    runs-on: [self-hosted, metricas]
    timeout-minutes: 5
    steps:
      - name: Resultado do portão (a conclusão desta execução é a evidência)
        env:
          EVENTO: ${{ github.event_name }}
          SHA: ${{ needs.escopo.outputs.sha }}
          ESCOPO: ${{ needs.escopo.outputs.escopo }}
          RESULTADO_ESCOPO: ${{ needs.escopo.result }}
          RESULTADOS_CODIGO: ${{ needs.qualidade.result }} ${{ needs.banco.result }} ${{ needs.e2e.result }} ${{ needs.perf.result }} ${{ needs.migracao.result }}
          RESULTADO_SMOKE: ${{ needs.smoke.result }}
          RESULTADO_DOCS: ${{ needs.portao-docs.result }}
        run: |
          # Docs: só o docs:check. Código: qualidade, banco, e2e, perf e migracao em success (skipped não vale);
          # o smoke também, salvo na noturna (schedule), onde pulado é aceito.
          estado=failure
          if [ "$RESULTADO_ESCOPO" = 'success' ]; then
            if [ "$ESCOPO" = 'docs' ]; then
              [ "$RESULTADO_DOCS" = 'success' ] && estado=success
            else
              estado=success
              for r in $RESULTADOS_CODIGO; do [ "$r" = 'success' ] || estado=failure; done
              if [ "$EVENTO" = 'schedule' ]; then
                [ "$RESULTADO_SMOKE" = 'success' ] || [ "$RESULTADO_SMOKE" = 'skipped' ] || estado=failure
              else
                [ "$RESULTADO_SMOKE" = 'success' ] || estado=failure
              fi
            fi
          fi
          echo "estado=$estado escopo=$ESCOPO evento=$EVENTO"
          [ "$estado" = 'success' ]
