server {
  listen 80;
  root /usr/share/nginx/html;
  # `Host` original ($host, sem porta) para a validação de Host/Origin da aba Apontamento valer atrás do proxy (ADR 0020 revisão 4, R4-5).
  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; }
  location /health { proxy_pass http://api:3000; }
  location / { try_files $uri /index.html; }
}
